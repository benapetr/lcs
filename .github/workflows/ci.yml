name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-and-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsystemd-dev libjansson-dev libssl-dev

      - name: Build
        run: make

      - name: Run unit tests
        run: tests/unit/run.sh

      - name: Verify installation preserves persistent state
        run: tests/packaging/install-state.sh

      - name: Run integration tests
        run: tests/integration/run.sh
